title: Kevin Curran receives a grant to study leadership gender in social enterprises
date: 2026-08-20
outlet: A Sustainable Future, University of Amsterdam
url: https://asf.uva.nl/grants/overview-funded-grants-since-2019/spring-2026.html#Gender-and-dualpurpose-leadership-Understanding-financial-and-social-performance-in-social-enterprises-K-Curran--N-Rathert
summary: 'The project “Gender and dual-purpose leadership: Understanding financial and social performance in social enterprises”, with N. Rathert, asks whether leadership gender matters for social enterprises. First findings suggest that UK social enterprises with more women in leadership perform better. The grant funds a study of the career, governance, and team factors behind this.'
