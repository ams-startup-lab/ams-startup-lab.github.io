title: Yang Mei, Kevin Curran and Lien De Cuyper receive a grant to study who wants to work for social ventures
date: 2026-08-20
outlet: A Sustainable Future, University of Amsterdam
url: https://asf.uva.nl/grants/overview-funded-grants-since-2019/spring-2026.html#Attracted-to-impact-How-professional-social-identity-orientations-shape-job-seekers-intentions-to-apply-to-social-ventures--Y-Mei-K-Curran--L-De-Cuyper
summary: 'The project “Attracted to impact? How professional social identity orientations shape job seekers’ intentions to apply to social ventures” received €3,000 to extend data collection. Social ventures find it harder than commercial ventures to attract a lasting workforce. The project asks which job seekers are drawn to social ventures, and why.'
members:
- yang-mei
- kevin-curran
- lien-de-cuyper
