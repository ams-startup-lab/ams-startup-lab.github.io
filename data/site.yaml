name: Amsterdam Startup Lab
hero:
  heading: Welcome to the Amsterdam Startup Lab (ASL)
  tagline: The University of Amsterdam Community Hub for Collaboration with Entrepreneurship Scholars
about:
  heading: About Us
  text:
  - ASL is a thriving community of entrepreneurship scholars based at the University of Amsterdam. Our work delves into the heart of startups—examining the people, processes, and environments that drive them to scale new heights or face challenging stagnation.
  - 'Our mission is simple yet powerful: To advance evidence-based discourse on the future of startups through rigorous, cutting-edge research. By partnering practitioners, policymakers, and students, we identify critical research questions and provide insights into solutions that make a real impact.'
  - Join us to explore what makes startups succeed, scale, or stumble. Whether you’re an academic, entrepreneur, investor, startup employee, policymaker, or just curious about the startup ecosystem, ASL is open for exciting collaborations.
