title: Business Cases in New Technology (MScBA)
kind: teaching
year: 2024
until: present
summary: Taehyun Lee (since 2024) and Onajomo Akemu (since 2025) teach how businesses turn new technologies into business cases. The course combines the history of earlier technologies with “living cases” presented by founders of technology startups and managers of established firms.
