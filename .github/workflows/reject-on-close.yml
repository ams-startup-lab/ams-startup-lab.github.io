# Closing a candidate pull request without merging means "rejected".
# Record its DOI or URL in data/rejected.yaml so it is never proposed again.
name: Record rejected candidate
on:
  pull_request_target:
    types: [closed]
permissions:
  contents: write
jobs:
  reject:
    if: >-
      github.event.pull_request.merged == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'claude/cand-')
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7 # main
        with:
          fetch-depth: 0
      - run: git fetch origin "$HEAD_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -q -r pipeline/requirements.txt
      - name: Record the items this pull request would have added
        run: |
          mkdir -p /tmp/rejected
          git diff --name-only --diff-filter=A "$BASE_SHA...$HEAD_SHA" -- data/publications data/news data/events | while read -r f; do
            git show "$HEAD_SHA:$f" > "/tmp/rejected/$(basename "$f")"
          done
      # Two pull requests closed close together race to push. On a refused push,
      # start again from the latest main and re-run reject.py, so no rejection is lost.
      - name: Commit and push
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          files=(/tmp/rejected/*.yaml)
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python pipeline/reject.py "${files[@]}"
            git add data/rejected.yaml
            if git diff --cached --quiet; then echo "Nothing new to record"; exit 0; fi
            git commit -q -m "Record rejected candidate from #$PR_NUMBER"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "Could not record the rejection after 5 attempts" >&2
          exit 1
